---
# API server: the /sm/* endpoints for browser sign-in and the gRPC API for ExtAuthZ and CMK.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "session-manager.fullname" . }}
  namespace: {{ include "session-manager.namespace" . }}
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: session-manager
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "session-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: session-manager
  template:
    metadata:
      annotations:
        # Restart the pods when the configuration changes.
        checksum/config: {{ include "session-manager.config" . | sha256sum }}
        {{- with .Values.pod.annotations }}
        {{- include "session-manager.annotations" . | trim | nindent 8 }}
        {{- end }}
      labels:
        {{- include "session-manager.labels" . | nindent 8 }}
        {{- with .Values.pod.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: session-manager
    spec:
      {{- include "session-manager.podSettings" . | trim | nindent 6 }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "session-manager.name" . }}
          image: "{{ template "session-manager.image" (tuple .Values.image) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with include "session-manager.command" . | trim }}
          {{- . | nindent 10 }}
          {{- end }}
          args: ["api-server"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "session-manager.env" . | nindent 10 }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.lifecycle }}
          lifecycle:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "session-manager.volumeMounts" . | nindent 10 }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "session-manager.volumes" (dict "ctx" . "configMap" (include "session-manager.configMapName" .)) | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
