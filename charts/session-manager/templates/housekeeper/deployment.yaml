{{- if .Values.housekeeper.enabled }}
---
# Housekeeper: deletes idle sessions and refreshes access tokens before they expire.
# Exactly one replica must run.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "session-manager.fullname" . | trunc 51 | trimSuffix "-" }}-housekeeper
  namespace: {{ include "session-manager.namespace" . }}
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
    app.kubernetes.io/component: housekeeper
spec:
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  {{- with .Values.housekeeper.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "session-manager.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: housekeeper
  template:
    metadata:
      annotations:
        # Restart the pod when the configuration changes.
        checksum/config: {{ include "session-manager.config" . | sha256sum }}
        {{- with .Values.pod.annotations }}
        {{- include "session-manager.annotations" . | trim | nindent 8 }}
        {{- end }}
      labels:
        {{- include "session-manager.labels" . | nindent 8 }}
        {{- with .Values.pod.labels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        app.kubernetes.io/component: housekeeper
    spec:
      {{- include "session-manager.podSettings" . | trim | nindent 6 }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ include "session-manager.name" . }}-housekeeper
          image: "{{ template "session-manager.image" (tuple .Values.image .Chart.AppVersion) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with include "session-manager.command" . | trim }}
          {{- . | nindent 10 }}
          {{- end }}
          args: ["housekeeper"]
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- $statusPorts := list }}
          {{- range .Values.ports }}
          {{- if eq (toString .name) "http-status" }}
          {{- $statusPorts = append $statusPorts . }}
          {{- end }}
          {{- end }}
          {{- with $statusPorts }}
          # The housekeeper serves only the status endpoints.
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "session-manager.env" . | nindent 10 }}
          {{- with .Values.housekeeper.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.housekeeper.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.housekeeper.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "session-manager.volumeMounts" . | nindent 10 }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- include "session-manager.volumes" (dict "ctx" . "configMap" (include "session-manager.configMapName" .)) | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.housekeeper.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
