---
# Configuration of the API server and the housekeeper, mounted as
# /etc/session-manager/config.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "session-manager.configMapName" . }}
  namespace: {{ include "session-manager.namespace" . }}
  labels:
    {{- include "session-manager.labels" . | nindent 4 }}
  {{- with .Values.configMap.annotations }}
  annotations:
    {{- include "session-manager.annotations" . | trim | nindent 4 }}
  {{- end }}
{{- if include "session-manager.configImmutable" . }}
immutable: true
{{- end }}
data:
  config.yaml: |-
    {{- include "session-manager.config" . | nindent 4 }}
