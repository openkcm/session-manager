# Values for local development with `make start` (k3d), applied on top of values.yaml.
# They contain development credentials: never use them elsewhere.
image:
  registry: kms20
  repository: session-manager
  tag: latest

config:
  environment: dev

  grpc:
    flags:
      reflection: true

  database:
    host: { value: postgresql.session-manager.svc.cluster.local }
    user: { value: postgres }
    password: { value: secret }

  valkey:
    host: { value: valkey-headless.session-manager.svc.cluster.local:6379 }
    password: { value: secret }

  sessionManager:
    callbackURL: http://localhost:8080/sm/callback
    csrfSecret: { value: my-csrf-secret-at-least-thirty-two-bits-size }
    clientAuth:
      clientID: client-id
      clientSecret: { value: secret }
    csrfCookieTemplate:
      domain: localhost
