apiVersion: v2
type: application
name: session-manager
description: >-
  OpenKCM Session Manager: browser sign-in for the CMK UI with the OpenID Connect
  authorization code flow, server-side sessions, and the tenant trust records that
  ExtAuthZ uses to validate tokens.
home: https://openkcm.io/components/cmk/session-manager
sources:
  - https://github.com/openkcm/session-manager
keywords:
  - openkcm
  - cmk
  - oidc
  - session
  - authentication
# Version of the chart. Increment it for every change to the chart.
# Versions follow Semantic Versioning (https://semver.org/).
version: 0.11.1
# Session Manager release this chart deploys by default: the tag of its image (the default of
# image.tag). release-please updates it in each release pull request (marker on the line).
# Increase `version` in the same pull request, otherwise the chart release workflow skips the
# already-published chart version.
appVersion: "v0.20.1" # x-release-please-version
