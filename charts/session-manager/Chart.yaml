apiVersion: v2
type: application
name: session-manager
description: >-
  OpenKCM Session Manager: browser sign-in for the CMK UI with the OpenID Connect
  authorization code flow, server-side sessions, and the tenant trust records that
  ExtAuthZ uses to validate tokens.
home: https://openkcm.io/components/cmk/session-manager
sources:
  - https://github.com/openkcm/session-manager
keywords:
  - openkcm
  - cmk
  - oidc
  - session
  - authentication
# Version of the chart. Increment it for every change to the chart.
# Versions follow Semantic Versioning (https://semver.org/).
version: 0.11.0
# Session Manager release this chart is made for: the tag of its image, and the default of image.tag.
# The workflow update-app-versions opens a pull request when openkcm/session-manager has a newer release.
appVersion: "v0.20.1"
