# Default values for the OpenKCM Session Manager chart.
#
# The chart runs three workloads from the same image and the same configuration:
#   - API server (Deployment): the /sm/* endpoints for browser sign-in, and the gRPC API
#     that ExtAuthZ and CMK call.
#   - Housekeeper (Deployment, one replica): deletes idle sessions and refreshes access
#     tokens before they expire.
#   - Migration (Job, Helm hook): creates and updates the database schema before every
#     install and upgrade.
#
# Values marked **Required** must be set for a working installation. Settings of Session
# Manager itself are under `config`, documented there with every key and an example of
# every alternative, and in the configuration reference:
# https://openkcm.io/components/cmk/security/session-manager-config

# -- Override the chart name in resource names and in the `app.kubernetes.io/name` label.
# The configuration is always mounted as `/etc/session-manager/config.yaml`.
nameOverride: ""

# -- Override the full name of the resources. Default: `<release>-session-manager`, or the
# release name if it already contains `session-manager`.
fullnameOverride: ""

# -- Namespace of all resources. Empty: the release namespace. Useful when this chart is a
# dependency of another chart.
namespace: ""

# -- Labels added to all resources.
commonLabels: {}

image:
  # -- Registry of the image.
  registry: ghcr.io/openkcm
  # -- Repository of the image in the registry.
  repository: session-manager/images/session-manager
  # -- Session Manager version to deploy, for example `v0.20.1`. Empty: the chart's
  # appVersion, the Session Manager release this chart release deploys by default.
  tag: ""
  # -- Image digest, for example `sha256:…`. Takes precedence over `tag`.
  digest: ""
  # -- Image pull policy.
  pullPolicy: IfNotPresent
  # -- Override the entrypoint, as a string or a list. Empty: the image's entrypoint
  # (`/session-manager` in the published image). The chart passes the subcommand
  # (`api-server`, `housekeeper` or `migrate`) as argument.
  command: []

# -- Secrets for pulling the image from a private registry, for example
# `[{ name: registry-access }]`.
imagePullSecrets: []

serviceAccount:
  # -- Create a ServiceAccount for the API server and the housekeeper. The migration job
  # runs before the release's resources exist; it uses the namespace's `default`
  # ServiceAccount, or `name` if `create` is false.
  create: true
  # -- Set `automountServiceAccountToken` on the ServiceAccount. Session Manager does not
  # call the Kubernetes API; the pods never mount the token.
  automount: false
  # -- Annotations for the ServiceAccount, for example for workload identity.
  annotations: {}
  # -- Name of the ServiceAccount. Empty with `create: true`: the chart's full name. Empty
  # with `create: false`: `default`.
  name: ""

# =============================================================================
# API server
# =============================================================================

# -- Number of API server replicas, when `autoscaling` is disabled. Use two or more in
# production: every browser sign-in and every session check of ExtAuthZ calls the API
# server. Sessions are stored in Valkey, so replicas need no affinity.
replicaCount: 1

# -- Old ReplicaSets kept for rollbacks (API server and housekeeper).
revisionHistoryLimit: 10

# -- Update strategy of the API server Deployment. Empty: Kubernetes' default rolling update.
strategy: {}

pod:
  # -- Annotations for all pods, for example for a service mesh. The chart always adds
  # `checksum/config`, which restarts the pods when the configuration changes.
  annotations: {}

  # -- Additional labels for all pods.
  labels: {}

  # -- Pod security context of all pods. The defaults run Session Manager as user and group
  # 65532, the non-root user of the published image, with the runtime's default seccomp
  # profile. `runAsUser` is set because Kubernetes enforces `runAsNonRoot` only for images
  # with a numeric user. `fsGroup` gives group 65532 access to mounted volumes, so Secrets
  # mounted with a restrictive `defaultMode` (for example `0400`) stay readable.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
    seccompProfile:
      type: RuntimeDefault

  # -- Inject environment variables for the Services of the namespace. Session Manager does
  # not need them.
  enableServiceLinks: false

  # -- PriorityClass of the API server and housekeeper pods. Sign-in depends on the API
  # server; consider a high priority class.
  priorityClassName: ""

  # -- Seconds a pod has to stop after SIGTERM. Null: the Kubernetes default (30).
  terminationGracePeriodSeconds: null

  disruptionBudget:
    # -- Create a PodDisruptionBudget for the API server. Use it with two or more replicas.
    enabled: false
    # Set at most one of the following. If neither is set, `maxUnavailable: 1` is used.
    # minAvailable: 1
    # maxUnavailable: 1

# -- Container security context of all Session Manager containers. The root filesystem is
# read-only; `/tmp` is a writable `emptyDir` (see `tmpVolume`).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

tmpVolume:
  # -- Mount a writable `emptyDir` at `/tmp` in all Session Manager containers.
  enabled: true
  # -- Size limit of the `/tmp` volume.
  sizeLimit: 64Mi

# -- Container ports of the API server. Each must match the listen address in `config`:
# `http` = `config.http.address`, `grpc` = `config.grpc.address`, `http-status` =
# `config.status.address`. The housekeeper exposes only `http-status`. The probes, the
# Service and the NetworkPolicy refer to the ports by name.
ports:
  - name: http-status
    containerPort: 8888
    protocol: TCP
  - name: http
    containerPort: 8080
    protocol: TCP
  - name: grpc
    containerPort: 9091
    protocol: TCP

service:
  # -- Service type. Keep `ClusterIP`: Envoy Gateway publishes the `/sm/*` endpoints, and
  # the gRPC API must only be reachable by ExtAuthZ and CMK.
  type: ClusterIP
  # -- Additional labels for the Service.
  labels: {}
  # -- Annotations for the Service.
  annotations: {}
  # -- Service ports. `http` (8080) is the target of Envoy Gateway's route for `/sm/*`;
  # `grpc` (9091) is the address that ExtAuthZ (`sessionManager.address`) and CMK use;
  # `http-status` (8888) serves metrics if enabled. Remove `http-status` if nothing
  # scrapes it through the Service.
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: http
    - name: http-status
      port: 8888
      protocol: TCP
      targetPort: http-status
    - name: grpc
      port: 9091
      protocol: TCP
      targetPort: grpc
      appProtocol: grpc

# -- Resources of the API server container. The ephemeral-storage limit covers the
# container's logs and the `/tmp` volume (`tmpVolume.sizeLimit`); a pod that exceeds it is
# evicted.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 256Mi
  limits:
    memory: 512Mi
    ephemeral-storage: 1Gi

# -- Startup probe of the API server. Empty: none.
startupProbe: {}

# -- Liveness probe of the API server. Needs `config.status.enabled: true`.
livenessProbe:
  httpGet:
    path: /probe/liveness
    port: http-status
    scheme: HTTP
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# -- Readiness probe of the API server: a TCP check of the `grpc` port. The API server opens
# it after it has connected to PostgreSQL and Valkey and checked the database schema, and
# opens the `http` port right after; it stops if any of this fails. The status endpoint
# `/probe/readiness` is not used: it reports ready as soon as the status server runs,
# before the API server listens.
readinessProbe:
  tcpSocket:
    port: grpc
  periodSeconds: 10
  timeoutSeconds: 2
  failureThreshold: 3

# -- Lifecycle hooks of the API server container. Session Manager stops at once on SIGTERM;
# a short `preStop` pause lets load balancers remove the pod before it stops, for example
# `{ preStop: { sleep: { seconds: 5 } } }` (Kubernetes 1.30 or later).
lifecycle: {}

autoscaling:
  # -- Scale the API server with a HorizontalPodAutoscaler. When enabled, `replicaCount` is
  # not used.
  enabled: false
  # -- Minimum number of replicas.
  minReplicas: 2
  # -- Maximum number of replicas.
  maxReplicas: 5
  # -- Target average CPU utilization, in percent of the CPU request. Null: not used.
  targetCPUUtilizationPercentage: 80
  # -- Target average memory utilization, in percent of the memory request. Null: not used.
  # At least one target must be set.
  targetMemoryUtilizationPercentage: 80
  # -- Scaling behavior (`autoscaling/v2` `behavior`). Empty: the Kubernetes defaults.
  behavior: {}

# -- Node labels for the pods of all workloads.
nodeSelector: {}

# -- Tolerations for the pods of all workloads.
tolerations: []

# -- Affinity of the API server pods. The housekeeper uses `housekeeper.affinity`.
affinity: {}

# -- Topology spread constraints of the API server pods, for example to spread the replicas
# across zones.
topologySpreadConstraints: []

# =============================================================================
# Shared by all workloads
# =============================================================================

# -- Additional init containers of all pods, including the migration job.
extraInitContainers: []

# -- Additional containers of the API server and housekeeper pods. Not added to the
# migration job (see `migrate.extraContainers`).
extraContainers: []

# -- Additional volumes of all pods, for example the Secrets with the database password,
# the Valkey password and certificates, the client secret and the CSRF secret. Refer to the
# mounted files from `config` with `source: file`.
extraVolumes: []
# - name: credentials
#   projected:
#     sources:
#       - secret:
#           name: session-manager-database
#           items: [{ key: password, path: database/password }]
#       - secret:
#           name: session-manager-valkey
#           items: [{ key: password, path: valkey/password }]
#       - secret:
#           name: session-manager-oidc-client
#           items: [{ key: client-secret, path: client-auth/client-secret }]
#       - secret:
#           name: csrf-secret                  # the same Secret as ExtAuthZ's
#           items: [{ key: csrf_secret, path: csrf-secret/csrf_secret }]

# -- Additional volume mounts of all Session Manager containers.
extraVolumeMounts: []
# - name: credentials
#   mountPath: /etc/credentials
#   readOnly: true

# -- Additional environment variables of all Session Manager containers. The PostgreSQL
# client reads the standard `PG*` variables, for example `PGSSLMODE=verify-full` and
# `PGSSLROOTCERT` to require TLS (see `config.database`). Never set `DEBUGFEATURES` in
# production: it logs complete HTTP requests and responses, including tokens.
extraEnvs: []

# -- Additional `envFrom` sources of all Session Manager containers.
extraEnvsFrom: []

# =============================================================================
# Housekeeper
# =============================================================================

housekeeper:
  # -- Run the housekeeper. Without it, idle sessions are not deleted before
  # `sessionDuration` and access tokens are not refreshed. Run exactly one per
  # installation.
  enabled: true
  # -- Update strategy. A rolling update without surge stops the old pod before the new one
  # starts, so two housekeepers never refresh the same tokens. Do not use `Recreate`: with
  # server-side apply (Helm 4), a Deployment created by chart versions before 0.11.0 keeps
  # its `rollingUpdate` settings, which Kubernetes rejects with `Recreate`, so the upgrade
  # fails.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # -- Resources of the housekeeper container, including ephemeral storage for its logs
  # and `/tmp`.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 256Mi
      ephemeral-storage: 512Mi
  # -- Liveness probe. Needs `config.status.enabled: true`.
  livenessProbe:
    httpGet:
      path: /probe/liveness
      port: http-status
      scheme: HTTP
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  # -- Readiness probe. Needs `config.status.enabled: true`.
  readinessProbe:
    httpGet:
      path: /probe/readiness
      port: http-status
      scheme: HTTP
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3
  # -- Affinity of the housekeeper pod.
  affinity: {}

# =============================================================================
# Database migration
# =============================================================================

migrate:
  # -- Run the migration job as a Helm `pre-install` and `pre-upgrade` hook. If disabled,
  # run `session-manager migrate` yourself before every upgrade: the API server does not
  # start on an outdated schema.
  enabled: true
  # -- Retries before the job, and with it the install or upgrade, fails.
  backoffLimit: 6
  # -- Maximum run time of the job in seconds. Null: no limit; Helm's `--timeout` still
  # applies.
  activeDeadlineSeconds: null
  # -- Seconds after which a finished job is deleted. Null: the job is kept until the
  # next install or upgrade replaces it.
  ttlSecondsAfterFinished: 300
  # -- Annotations for the job's pod, added to `pod.annotations`. For example
  # `sidecar.istio.io/inject: "false"`, if a service mesh sidecar would keep the job from
  # completing.
  podAnnotations: {}
  # -- Resources of the migration container, including ephemeral storage for its logs and
  # `/tmp`.
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
      ephemeral-storage: 128Mi
    limits:
      memory: 256Mi
      ephemeral-storage: 512Mi
  # -- Additional containers of the job's pod. They must exit on their own, or the job
  # never completes.
  extraContainers: []

# =============================================================================
# Network policy
# =============================================================================

networkPolicy:
  # -- **Recommended.** Create a NetworkPolicy that allows ingress to the pods only from
  # the peers below. The gRPC API has no authentication of its own and can change tenant
  # trust records.
  enabled: false
  http:
    # -- Peers allowed on the `http` port (`/sm/*`): Envoy Gateway. Empty: none.
    from: []
    # - namespaceSelector:
    #     matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
  grpc:
    # -- Peers allowed on the `grpc` port: ExtAuthZ and CMK. Empty: none.
    from: []
    # - namespaceSelector:
    #     matchLabels: { kubernetes.io/metadata.name: envoy-gateway-system }
    #   podSelector:
    #     matchLabels: { app.kubernetes.io/name: extauthz }
    # - podSelector:
    #     matchLabels: { app.kubernetes.io/name: cmk }
  status:
    # -- Peers allowed on the `http-status` port, for example a metrics collector. Empty:
    # none. Probes from the kubelet are not affected on most network plugins.
    from: []
  # -- Additional ingress rules, in NetworkPolicy syntax.
  extraIngress: []

# =============================================================================
# Configuration
# =============================================================================

configMap:
  # -- Make the configuration ConfigMap immutable. Its name then contains a hash of the
  # content, so every change creates a new ConfigMap.
  immutable: false
  # -- Annotations for the configuration ConfigMap.
  annotations: {}

# Session Manager configuration, written to `config.yaml` and mounted as
# `/etc/session-manager/config.yaml` in all workloads (helper session-manager.config in
# templates/_helpers.tpl, used by templates/configmap.yaml and, for the migration job,
# templates/migrate/configmap.yaml). Every key below is passed through, except
# `environment` and `labels`, which become `application.environment` and
# `application.labels`, and the chart setting `isImmutable` (deprecated; use
# `configMap.immutable`). Session Manager reads the configuration and every file it
# refers to at startup. The migration job uses `logger`, `database`, `migrate` and
# `sessionManager.clientAuth.clientID`; it runs no status server and sends no telemetry.
#
# Session Manager ignores unknown keys without a warning: write every key exactly as shown,
# with the same nesting. Durations are Go duration strings: `500ms`, `10s`, `5m`, `1h30m`.
# `featureGates` and `featureFlags`, which other OpenKCM services read, have no effect.
#
# Value references. Settings marked "value reference" take one of these forms. `source`
# defaults to `embedded`, so `{ value: "…" }` is enough for an embedded value.
#   { source: embedded, value: "…" }      # the value itself. Stored in plain text in the
#                                         # ConfigMap: do not use it for secrets
#   { source: env, env: VARIABLE_NAME }   # an environment variable of the container
#                                         # (extraEnvs, extraEnvsFrom). Startup fails if it
#                                         # is not set or empty
#   { source: file, file: { path: /etc/credentials/db/password, format: binary } }
#                                         # the whole file as it is: a trailing newline is part
#                                         # of the value. Mount Secrets with extraVolumes and
#                                         # extraVolumeMounts. format: yaml reads the whole file
#                                         # too
#   { source: file, file: { path: /etc/credentials/db.json, format: json,
#                           jsonPath: "$.password" } }
#                                         # one string field of a JSON file
#
# mTLS settings (`valkey.secretRef.mtls`, `sessionManager.clientAuth.mTLS`,
# `audit.httpClient.mtls`, `telemetry.*.secretRef.mtls`): TLS 1.2 or later with a client
# certificate.
#   cert: <value reference>          # client certificate (PEM)
#   certKey: <value reference>       # its private key (PEM)
#   serverCa: <value reference>      # optional: CA that signed the server certificate
#   rootCAs: [<value reference>]     # optional: more trusted CAs. With serverCa or rootCAs,
#                                    # only these CAs are trusted; without, the CA
#                                    # certificates of the image
#   attributes:                      # optional
#     serverName: …                  # expected server name, if it differs from the address
#     sessionTicketsDisabled: true   # do not resume TLS sessions
#     allowTLSRenegotiationOnce: true  # accept one TLS renegotiation by the server
config:
  # -- Environment name (`application.environment`), attached to logs, traces and metrics.
  environment: production

  # -- Additional attributes (`application.labels`) attached to logs, traces and metrics,
  # for example `{ region: eu10 }`.
  labels: {}

  # `application` overrides single fields of the application section, which the chart
  # builds from `environment` and `labels`: `name` (the service name in logs, traces and
  # metrics; default `session-manager`, or `nameOverride`), `environment` and `labels`.
  # Example:
  # application:
  #   name: session-manager-eu10

  logger:
    # -- Log level: `trace`, `debug`, `info`, `warn` or `error`, in any case. Any other
    # value: `info`.
    level: info
    # -- Log format: `json` or `text`.
    format: json
    # `source: true` adds the source file and line of each log call (default `false`).
    # Example:
    # source: true
    formatter:
      time:
        # -- Timestamp format: `pattern` (a Go time layout, in UTC) or `unix` (a number:
        # the time since 1970 in units of `precision`).
        type: pattern
        # -- Go time layout, for `type: pattern`.
        pattern: "Mon Jan 02 15:04:05 -0700 2006"
        # -- Unit of the timestamp, for `type: unix`: exactly `1ns`, `1us`, `1ms` or `1s`.
        precision: 1s
        # Example:
        # type: unix
        # precision: 1ms
      fields:
        # -- Attribute whose errors are written with their `message`, `type` and
        # `stacktrace`. Session Manager logs errors as `error`.
        error: error
        # -- Names of the message, level and timestamp fields of a log record.
        message: msg
        level: level
        time: time
        otel:
          # -- Names of the trace and span ID fields, added to records of traced requests.
          traceId: trace.id
          spanId: span.id
        masking:
          # -- Fields whose values are masked, keeping the first four characters.
          pii:
            - email
            - ip-address
          # -- Fields whose values are replaced with the given text.
          other:
            jwt-token: "*****"

  # Status server of the API server and the housekeeper. `timeout` has no effect.
  status:
    # -- Serve the status endpoints: `/probe/liveness`, `/probe/readiness`, `/version`
    # (build information), and `/metrics` if Prometheus metrics are enabled (see
    # `telemetry`). Needed by the probes.
    enabled: true
    # -- Listen address of the status server. Must match the `http-status` container port.
    address: :8888
    # -- Serve Go profiling endpoints (`/debug/pprof/…`) on the status port, without
    # authentication. Keep false in production; enable it only for troubleshooting.
    profiling: false

  http:
    # -- Listen address of the `/sm/*` endpoints. Must match the `http` container port. TLS
    # is terminated by Envoy Gateway. `unix:///<path>` listens on a Unix socket instead.
    address: :8080
    # `shutdownTimeout` (default `5s`): how long open requests may finish when Session
    # Manager stops. It applies only on SIGINT: Session Manager does not handle SIGTERM,
    # which Kubernetes sends to stop a pod, and stops at once.
    # Example:
    # shutdownTimeout: 5s

  grpc:
    # -- Listen address of the gRPC API (the gRPC server app in `apps`). Must match the
    # `grpc` container port and the address that ExtAuthZ and CMK use. The gRPC API has no
    # TLS and no authentication: restrict access with `networkPolicy`.
    address: :9091
    flags:
      # -- Serve the gRPC health service (`grpc.health.v1.Health`).
      health: true
      # -- Serve gRPC server reflection, for tools such as grpcurl. Keep false in production.
      reflection: false
    # Further settings, shown below with their defaults:
    #   shutdownTimeout           how long open calls may finish when Session Manager stops;
    #                             applies only on SIGINT, like `http.shutdownTimeout`
    #   maxRecvMsgSize            largest message the server accepts, in bytes
    #   efPolMinTime              minimum time between keepalive pings of a client; the
    #                             server closes the connection of a client that pings more
    #                             often
    #   efPolPermitWithoutStream  accept keepalive pings while no call is active
    #   attributes:
    #     maxConnectionIdle       close a connection after this time without calls
    #     maxConnectionAge        close a connection after this time (±10%)
    #     maxConnectionAgeGrace   time that open calls get after maxConnectionAge
    #     time                    ping a client after this time without activity (minimum 1s)
    #     timeout                 close the connection if the ping is not answered in time
    # `enabled` and `maxSendMsgSize` have no effect.
    # Example:
    # shutdownTimeout: 5s
    # maxRecvMsgSize: 125829120
    # efPolMinTime: 180s
    # efPolPermitWithoutStream: false
    # attributes:
    #   maxConnectionIdle: 1800s
    #   maxConnectionAge: 1800s
    #   maxConnectionAgeGrace: 300s
    #   time: 120m
    #   timeout: 20s

  # PostgreSQL with the tenant trust records. There are no settings for TLS; the client
  # reads the `PGSSLMODE` and `PGSSLROOTCERT` environment variables (`extraEnvs`). By
  # default `PGSSLMODE` is not set, so the client uses `prefer`: it tries TLS without
  # checking the server certificate and falls back to an unencrypted connection. To require
  # TLS with a verified certificate, set `PGSSLMODE=verify-full` and `PGSSLROOTCERT` (the
  # path of the CA certificate, or `system`).
  database:
    # -- Database module. `database.module.pgxpool` (PostgreSQL) is the only one.
    module: database.module.pgxpool
    # -- **Required.** Host name; value reference.
    host:
      source: embedded
      value: ""
    # -- Port, as a string.
    port: "5432"
    # -- Database name.
    name: session_manager
    # -- **Required.** User; value reference.
    user:
      source: embedded
      value: ""
    # -- **Required.** Password; value reference. Use `source: file`.
    password:
      source: embedded
      value: ""
    # Host, port, name, user and password go into a PostgreSQL connection string without
    # quoting: they must not contain spaces, backslashes or single quotes.
    # Example, with the three forms of value references:
    # host: { source: embedded, value: postgresql.services.svc.cluster.local }
    # user: { source: env, env: DATABASE_USER }
    # password:
    #   source: file
    #   file: { path: /etc/credentials/database/password, format: binary }

  # Valkey with the pending sign-ins and the sessions, including the users' access and
  # refresh tokens. Protect it accordingly. Used by the API server and the housekeeper.
  valkey:
    # -- Session store module. `sessionstore.module.valkey` is the only one.
    module: sessionstore.module.valkey
    # -- **Required.** `host:port`, value reference; the port is required. One address: a
    # standalone Valkey or a node of a Valkey cluster. Several addresses, separated by
    # commas: nodes of a Valkey cluster, or the Sentinels (see `masterSet`).
    host:
      source: embedded
      value: ""
    # -- User; value reference. Empty: the default user.
    user:
      source: embedded
      value: ""
    # -- Password; value reference. Use `source: file`.
    password:
      source: embedded
      value: ""
    # -- Prefix of all keys (`<prefix>:<type>:<id>`). A trailing `:` is removed. Give every
    # installation that shares a Valkey its own prefix.
    prefix: session-manager
    # -- Transport security: `type: insecure` (no TLS) or `type: mtls` with an `mtls` block
    # (see "mTLS settings" above). The default, `insecure`, sends the users' access and
    # refresh tokens to Valkey unencrypted. Use `mtls` unless a service mesh encrypts the
    # traffic.
    secretRef:
      type: insecure
    # Example:
    # secretRef:
    #   type: mtls
    #   mtls:
    #     cert: { source: file, file: { path: /etc/credentials/valkey/tls.crt, format: binary } }
    #     certKey: { source: file, file: { path: /etc/credentials/valkey/tls.key, format: binary } }
    #     serverCa: { source: file, file: { path: /etc/credentials/valkey/ca.crt, format: binary } }
    #     attributes:
    #       serverName: valkey.storage.svc.cluster.local
    #
    # Valkey Sentinel: `masterSet` is the name of the master set; `host` then lists the
    # Sentinels, and `user`, `password` and `secretRef` apply to them too.
    # `topologyRefreshInterval` (default `0`: off) also asks the Sentinels for the current
    # master at this interval, in addition to their failover notifications.
    # Example:
    # masterSet: mymaster
    # topologyRefreshInterval: 5s

  sessionManager:
    # -- **Required.** Absolute public URL of the callback endpoint, for example
    # `https://api.example.com/sm/callback`. Sent to the identity providers as
    # `redirect_uri` and must be registered at each of them. The endpoint itself is always
    # served at `/sm/callback`.
    callbackURL: ""
    # -- **Required.** Allowed beginnings of the URLs that the UI passes for redirects after
    # sign-in, errors and logout, for example `https://ui.example.com/`. Compared character
    # by character; always end entries with `/`. Empty: every sign-in and logout fails with
    # `400`.
    allowedRedirectBaseURLs: []
    # -- Maximum lifetime of a session, and of a pending sign-in.
    sessionDuration: 12h
    # -- A session ends after this time without requests.
    idleSessionTimeout: 90m
    # -- Accept identity providers (issuer and signing keys) served over plain `http`. For
    # local development only. The gRPC `session` service has its own setting (see `apps`).
    allowHttpScheme: false
    # -- **Required.** CSRF secret; value reference. At least 32 bytes, or the API server
    # does not start. **Must contain exactly the same bytes as ExtAuthZ's `csrfSecret`**;
    # otherwise every API call from the CMK UI fails with `401`. Use `source: file` with the
    # Secret shared with ExtAuthZ.
    csrfSecret:
      source: embedded
      value: ""
    # How Session Manager authenticates to the identity providers when it exchanges the
    # authorization code, refreshes tokens and introspects them. The same credentials are
    # used for all tenants; the client ID of each tenant comes from its trust record.
    clientAuth:
      # -- How to authenticate:
      # `client_secret` or `client_secret_post` (they behave the same): with `clientSecret`.
      # `mtls`: with the client certificate in `mTLS`, on every connection to the identity
      #   providers; the client ID is sent without a secret.
      # `insecure`: with the client ID only. For development only; logs a warning.
      type: client_secret
      # -- **Required at the first installation.** Client ID registered at the identity
      # provider. The database migration copies it into existing trust records, and fails
      # if it is empty.
      clientID: ""
      # -- Client secret, for `client_secret` and `client_secret_post`; value reference.
      # Use `source: file`.
      clientSecret:
        source: embedded
        value: ""
      # Example, `client_secret_post` with the secret in a JSON file:
      # type: client_secret_post
      # clientSecret:
      #   source: file
      #   file: { path: /etc/credentials/client-auth.json, format: json, jsonPath: "$.secret" }
      #
      # Example, `mtls`. Write `mTLS` here (`mtls` in other sections); see "mTLS settings"
      # above. `allowTLSRenegotiationOnce` directly under `clientAuth` is deprecated: use
      # `mTLS.attributes.allowTLSRenegotiationOnce`.
      # type: mtls
      # mTLS:
      #   cert:
      #     source: file
      #     file: { path: /etc/credentials/client-auth/tls.crt, format: binary }
      #   certKey:
      #     source: file
      #     file: { path: /etc/credentials/client-auth/tls.key, format: binary }
      #   serverCa:
      #     source: file
      #     file: { path: /etc/credentials/client-auth/ca.crt, format: binary }
      #   attributes:
      #     allowTLSRenegotiationOnce: true
      #
      # Example, for local development only:
      # type: insecure
    # Cookie templates. Fields: `name`; `path`; `domain` (empty: the API host only; must
    # be empty for names that start with `__Host-`); `maxAge` (seconds; 0 = until the
    # browser closes); `secure`; `httpOnly`; `sameSite` (exactly `Lax`, `Strict` or `None`;
    # any other spelling omits the attribute). When Session Manager sets a cookie, it logs a
    # warning, but continues, if the cookie is not `secure`, the session cookie is not
    # `httpOnly` or its name does not start with `__Host-Http-`, or a CSRF cookie is
    # `httpOnly` or not `Strict`. The warnings for the login CSRF cookie are expected.
    sessionCookieTemplate:
      # -- Session cookie name; `-<tenant ID>` is appended. ExtAuthZ requires this name.
      name: __Host-Http-SESSION
      # -- Cookie path.
      path: /
      # -- Send only over HTTPS.
      secure: true
      # -- Hide from JavaScript.
      httpOnly: true
      # -- `None` when UI and API are on different sites; `Lax` if they share a registrable
      # domain.
      sameSite: None
    csrfCookieTemplate:
      # -- CSRF cookie name; `-<tenant ID>` is appended. The CMK UI requires this name.
      name: CSRF
      # -- Cookie path.
      path: /
      # -- Cookie domain: the parent domain of the UI and API hosts, for example
      # `example.com`, so that the UI can read the cookie. Empty: the API host only.
      domain: ""
      # -- Send only over HTTPS.
      secure: true
      # -- SameSite attribute.
      sameSite: Strict
    loginCSRFCookieTemplate:
      # -- Cookie path. The name defaults to `__Host-LoginCSRF`.
      path: /
      # -- Send only over HTTPS.
      secure: true
      # -- Hide from JavaScript.
      httpOnly: true
      # -- Must be `Lax`: the cookie must be sent when the identity provider redirects the
      # browser back to `/sm/callback`.
      sameSite: Lax
      # Example, another name for local development over plain `http`, where browsers
      # refuse `__Host-` cookies:
      # name: LoginCSRF

  # Used by the housekeeper only.
  housekeeper:
    # -- How often housekeeping runs. It also runs once at startup.
    triggerInterval: 10m
    # -- Sessions processed in parallel; at least 1.
    concurrencyLimit: 10
    # -- Refresh access tokens that expire within this time. Keep it at least as long as
    # `triggerInterval`.
    tokenRefreshTriggerInterval: 15m

  # Modules. Each section selects its implementation with `module`; the defaults are the
  # only modules built into Session Manager.
  trust:
    # -- Module for the tenant trust records: `trust.module.oidc`.
    module: trust.module.oidc
    # -- Database module used for the trust records: `database.module.pgxpool`, configured
    # in `database`.
    dbModule: database.module.pgxpool
  credentials:
    # -- Module for the client authentication configured in `sessionManager.clientAuth`:
    # `credentials.module.oauth2`.
    module: credentials.module.oauth2
  migrate:
    # -- Module for the database migrations: `trust.migration.module.oidc`. The API server
    # also uses it to check the schema version at startup.
    module: trust.migration.module.oidc
    # -- Database module used by the migrations: `database.module.pgxpool`.
    dbModule: database.module.pgxpool

  # -- Long-running components of the API server, keyed by a name you choose. The only app
  # module is `app.module.grpcserver`: the gRPC server configured in `grpc`, which hosts
  # the services that ExtAuthZ (`session`) and CMK (`oidcmapping`) call. It can be used
  # once and needs at least one service; each service can be listed once. Without it,
  # ExtAuthZ and CMK cannot reach Session Manager, and the readiness probe of the API
  # server fails.
  apps:
    grpc:
      module: app.module.grpcserver
      services:
        # Sessions, for ExtAuthZ. Options, shown below with their defaults:
        # `allowHttpScheme` accepts token introspection endpoints over plain `http`, for
        # local development only; `trust`, `sessionStore` and `credentials` are the modules
        # it uses, configured in `trust`, `valkey` and `credentials`.
        - module: service.module.grpc.session
          # Example:
          # allowHttpScheme: false
          # trust: trust.module.oidc
          # sessionStore: sessionstore.module.valkey
          # credentials: credentials.module.oauth2
        # Tenant trust records. Option: `trust`, the trust module (default below).
        - module: service.module.grpc.trustmapping
          # Example:
          # trust: trust.module.oidc
        # Tenant trust records, with the older oidcmapping API. Option: `trust`, as above.
        - module: service.module.grpc.oidcmapping
          # Example:
          # trust: trust.module.oidc

  # `appsOrder` sets the start order of the apps, by their names in `apps`. Apps not listed
  # start after them. Apps stop in the reverse order. Startup fails if a name is not in
  # `apps`.
  # Example:
  # appsOrder:
  #   - grpc

  # Audit events (OTLP/HTTP logs) for successful and failed sign-ins. Omitted by default:
  # sign-ins work, but the events are not delivered and each attempt logs an error.
  #   endpoint              URL of the OTLP/HTTP logs endpoint of the collector
  #   httpClient:
  #     timeout             request timeout (default `10s`)
  #     apiToken            value reference: sent as `Authorization: Api-Token <token>`
  #     basicAuth           HTTP basic authentication: `username` and `password`, value
  #                         references. Takes precedence over `apiToken`
  #     mtls                client certificate (see "mTLS settings" above); can be combined
  #                         with `apiToken` or `basicAuth`
  #     transportAttributes connection settings, all optional: tlsHandshakeTimeout,
  #                         responseHeaderTimeout, expectContinueTimeout, idleConnTimeout
  #                         (durations; 0 = no limit), maxIdleConns, maxConnsPerHost (0 = no
  #                         limit), maxIdleConnsPerHost (0 = 2), disableKeepAlives,
  #                         disableCompression
  #   additionalProperties  YAML map of attributes added to every event, as a string
  # Example:
  # audit:
  #   endpoint: https://otel-collector.observability.svc:4318/v1/logs
  #   httpClient:
  #     timeout: 10s
  #     apiToken: { source: file, file: { path: /etc/credentials/audit/token, format: binary } }
  #     mtls:
  #       cert:    { source: file, file: { path: /etc/credentials/audit/tls.crt, format: binary } }
  #       certKey: { source: file, file: { path: /etc/credentials/audit/tls.key, format: binary } }
  #     transportAttributes:
  #       tlsHandshakeTimeout: 10s
  #       responseHeaderTimeout: 10s
  #       expectContinueTimeout: 1s
  #       idleConnTimeout: 90s
  #       maxIdleConns: 100
  #       maxIdleConnsPerHost: 10
  #       maxConnsPerHost: 0
  #       disableKeepAlives: false
  #       disableCompression: false
  #   additionalProperties: |
  #     appID: session-manager
  # Example, HTTP basic authentication:
  # audit:
  #   endpoint: https://otel-collector.observability.svc:4318/v1/logs
  #   httpClient:
  #     basicAuth:
  #       username: { source: env, env: AUDIT_USER }
  #       password:
  #         source: file
  #         file: { path: /etc/credentials/audit/password, format: binary }

  # OpenTelemetry export by the API server and the housekeeper. Omitted by default: nothing
  # is exported. `traces`, `metrics` and `logs` each take:
  #   enabled    export this signal (default `false`). Logs are exported in addition to
  #              the container output
  #   protocol   `grpc` (OTLP/gRPC) or `http` (OTLP/HTTP)
  #   host       value reference: `host:port` of the collector, without scheme
  #   url        for `protocol: http`: path of the endpoint, usually `/v1/traces`,
  #              `/v1/metrics` or `/v1/logs`. There is no default: set it
  #   secretRef  connection security:
  #                { type: insecure }                           no TLS
  #                { type: mtls, mtls: { … } }                  TLS with a client certificate
  #                { type: api-token, apiToken: <value reference> }
  #                                                             TLS, with the header
  #                                                             `Authorization: Api-Token …`
  #                { type: basic, basic: { username: <value reference>,
  #                                        password: <value reference> } }
  #                                                             TLS, with HTTP basic
  #                                                             authentication; grpc only
  # `metrics.prometheus.enabled: true` serves the metrics at `/metrics` on the status port
  # instead of sending them; it needs `metrics.enabled: true` and `status.enabled: true`,
  # and `protocol`, `host`, `url` and `secretRef` of `metrics` are not used.
  # `dynatraceOneAgent: true` adds the enrichment metadata of the Dynatrace OneAgent to the
  # resource attributes of the exported data.
  # Example:
  # telemetry:
  #   traces:
  #     enabled: true
  #     protocol: grpc
  #     host: { source: env, env: OTEL_COLLECTOR_HOST }
  #     secretRef: { type: insecure }
  #   metrics:
  #     enabled: true
  #     prometheus: { enabled: true }
  #   logs:
  #     enabled: true
  #     protocol: http
  #     host: { value: otel-collector.observability.svc:4318 }
  #     url: /v1/logs
  #     secretRef:
  #       type: mtls
  #       mtls:
  #         cert: { source: file, file: { path: /etc/credentials/otel/tls.crt, format: binary } }
  #         certKey: { source: file, file: { path: /etc/credentials/otel/tls.key, format: binary } }
  #         serverCa: { source: file, file: { path: /etc/credentials/otel/ca.crt, format: binary } }
  # Example, other connection security and Dynatrace:
  # telemetry:
  #   dynatraceOneAgent: true
  #   traces:
  #     enabled: true
  #     protocol: http
  #     host: { value: otel-collector.observability.svc:4318 }
  #     url: /v1/traces
  #     secretRef:
  #       type: api-token
  #       apiToken: { source: file, file: { path: /etc/credentials/otel/token, format: binary } }
  #   metrics:
  #     enabled: true
  #     protocol: grpc
  #     host: { value: otel-collector.observability.svc:4317 }
  #     secretRef:
  #       type: basic
  #       basic:
  #         username: { source: env, env: OTEL_USER }
  #         password:
  #           source: file
  #           file: { path: /etc/credentials/otel/password, format: binary }
